    UserPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - properties:
            data:
              $ref: '#/components/schemas/UserPage'
          type: object
      description: Success envelope whose data is a UserPage.
    WalletAsset:
      additionalProperties: false
      description: One token position of a wallet.
      properties:
        balance:
          description: Decimal-adjusted balance (1.5 = one and a half tokens).
          type:
            - number
            - "null"
        balance_raw:
          description: Balance in the smallest unit exactly as the chain reports it (decimal or hex string), for callers that need full precision.
          type:
            - string
            - "null"
        chain:
          description: Chain slug the position lives on.
          type: string
        price_usd:
          description: Current token price in USD when the provider attaches one.
          type:
            - number
            - "null"
        token:
          properties:
            address:
              description: Token contract address; null for the chain's native coin.
              type:
                - string
                - "null"
            decimals:
              description: Token decimals when reported.
              type:
                - integer
                - "null"
            logo_url:
              description: Logo image URL.
              type:
                - string
                - "null"
            name:
              description: Token name.
              type:
                - string
                - "null"
            symbol:
              description: Ticker symbol.
              type:
                - string
                - "null"
          required:
            - address
            - symbol
            - name
            - decimals
            - logo_url
          type: object
        value_usd:
          description: Position value in USD when the provider computes it.
          type:
            - number
            - "null"
      required:
        - chain
        - token
        - balance
        - balance_raw
        - price_usd
        - value_usd
      type: object
    WalletAssetPage:
      additionalProperties: false
