openapi: 3.1.0
info:
  description: Fixed, versioned, provider-independent methods over AgentKey's upstream catalog. Each method has a stable name, input schema and output schema; the server picks the upstream provider, fails over, normalizes fields and refunds failed attempts. Every response names the provider that served it, the credits charged and every attempt made.
  title: AgentKey Scenario Methods
  version: "2"
servers:
  - url: https://api.agentkey.app
paths:
  /v2/ops:
    get:
      description: The method catalog. No authentication required.
      operationId: listOps
      parameters:
        - description: Filter by domain.
          in: query
          name: domain
          schema:
            type: string
        - description: Filter by platform slug.
          in: query
          name: platform
          schema:
            type: string
        - description: Filter by action, e.g. post.search.
          in: query
          name: action
          schema:
            type: string
        - description: Include deprecated methods.
          in: query
          name: include_deprecated
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
          description: Catalog
      summary: List scenario methods
      tags:
        - catalog
  /v2/ops/academic.paper.get:
    post:
      description: |-
        Paper details by arXiv id (2307.12307, optionally with a version suffix), arxiv.org / alphaxiv.org abs or pdf URL, or AMiner paper id (24 hex chars, from academic.paper.search). arXiv papers come from alphaXiv's public API with title, abstract, authors, date and links; AMiner adds DOI, venue and citation count for its own ids. DOIs are not resolved.

        Fixed price: 0.2 credits per successful call, whichever provider serves it.
      operationId: academic_paper_get
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                fields:
                  $ref: '#/components/schemas/FieldsProjection'
                id_or_url:
                  description: arXiv id (1706.03762), arxiv.org / alphaxiv.org abs or pdf URL, or AMiner paper id (24 hex chars).
                  type: string
                include_raw:
                  $ref: '#/components/schemas/IncludeRaw'
                provider:
                  $ref: '#/components/schemas/ProviderShorthand'
                routing:
                  $ref: '#/components/schemas/Routing'
              required:
                - id_or_url
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperEnvelope'
          description: Success envelope
        "400":
          $ref: '#/components/responses/ValidationError'
        "402":
          $ref: '#/components/responses/InsufficientCredits'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimited'
        "502":
          $ref: '#/components/responses/UpstreamFailed'
        "504":
          $ref: '#/components/responses/Timeout'
      security:
        - ApiKeyAuth: []
      summary: Fetch one paper by arXiv id, arXiv URL or AMiner id. Returns a normalized Paper.
      tags:
        - academic
      x-action: paper.get
      x-price-credits: 0.2
      x-pricing: fixed
      x-providers:
        - aminer
        - alphaxiv-api
      x-since: "2026-10-13"
      x-stability: beta
  /v2/ops/academic.paper.search:
    post:
      description: |-
        Keyword search over Google Scholar (via Serper) and AMiner; the server picks the source and fails over. sort=recent / citations routes to AMiner, which can order that way.

        Fixed price: 0.2 credits per successful call, whichever provider serves it.
      operationId: academic_paper_search
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                cursor:
                  description: Opaque pagination cursor from the previous response's next_cursor. Send the same query parameters with it.
                  type: string
                fields:
                  $ref: '#/components/schemas/FieldsProjection'
                include_raw:
                  $ref: '#/components/schemas/IncludeRaw'
                limit:
                  default: 10
                  description: Maximum number of papers to return.
                  maximum: 20
                  minimum: 1
                  type: integer
                provider:
                  $ref: '#/components/schemas/ProviderShorthand'
                query:
                  description: Topic, title words or free-text question.
                  type: string
                routing:
                  $ref: '#/components/schemas/Routing'
                sort:
                  default: relevance
                  description: relevance = best match; recent = newest first; citations = most cited first.
                  enum:
                    - relevance
                    - recent
                    - citations
                  type: string
              required:
                - query
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperPageEnvelope'
          description: Success envelope
        "400":
          $ref: '#/components/responses/ValidationError'
        "402":
          $ref: '#/components/responses/InsufficientCredits'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimited'
        "502":
          $ref: '#/components/responses/UpstreamFailed'
        "504":
          $ref: '#/components/responses/Timeout'
      security:
        - ApiKeyAuth: []
      summary: Search scholarly papers by keyword. Returns a normalized Paper page.
      tags:
        - academic
      x-action: paper.search
      x-draft-bindings:
        - alphaxiv
      x-price-credits: 0.2
      x-pricing: fixed
      x-providers:
        - serper
        - aminer
        - alphaxiv
      x-since: "2026-10-13"
      x-stability: beta
