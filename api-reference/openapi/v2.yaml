            - string
            - "null"
        created_at:
          description: Account creation time, RFC 3339 UTC.
          format: date-time
          type:
            - string
            - "null"
        followers_count:
          description: Followers.
          type:
            - integer
            - "null"
        following_count:
          description: Accounts followed.
          type:
            - integer
            - "null"
        handle:
          description: Username / handle without the leading @.
          type:
            - string
            - "null"
        id:
          description: Platform-native user ID.
          type: string
        name:
          description: Display name.
          type:
            - string
            - "null"
        platform:
          description: Platform slug.
          type: string
        posts_count:
          description: Public posts.
          type:
            - integer
            - "null"
        url:
          description: Profile URL.
          type:
            - string
            - "null"
        verified:
          description: Platform verification badge.
          type:
            - boolean
            - "null"
      required:
        - id
        - handle
        - name
        - url
        - bio
        - avatar_url
        - verified
        - followers_count
        - following_count
        - posts_count
