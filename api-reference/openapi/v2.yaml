      properties:
        items:
          items:
            $ref: '#/components/schemas/WalletAsset'
          type: array
        next_cursor:
          description: Opaque cursor for the next page; null when exhausted or the provider cannot page.
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    WalletAssetPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - properties:
            data:
              $ref: '#/components/schemas/WalletAssetPage'
          type: object
      description: Success envelope whose data is a WalletAssetPage.
    WebPage:
      additionalProperties: false
      description: One fetched web page reduced to readable text, normalized across scrapers.
      properties:
        content_type:
          description: MIME type of the fetched document (text/html, application/pdf) when the scraper reports it.
          type:
            - string
            - "null"
        description:
          description: Meta description / summary line when the page has one.
          type:
            - string
            - "null"
        final_url:
          description: URL after redirects as reported by the scraper; null when the scraper does not report it.
          type:
            - string
            - "null"
        format:
          description: Format of `text` as delivered by the scraper.
          enum:
            - markdown
            - text
            - html
          type: string
        lang:
          description: BCP 47 language tag of the page when the scraper reports one.
          type:
            - string
            - "null"
        published_at:
          description: Publish time of the page when the scraper extracts one (article meta tags), RFC 3339 UTC.
          format: date-time
          type:
            - string
            - "null"
        status_code:
          description: HTTP status the target site answered with, when the scraper reports it.
          type:
            - integer
            - "null"
        text:
          description: Main content of the page in the requested format (markdown or plain text). Boilerplate (navigation, footers) is removed where the scraper supports it.
          type: string
        title:
          description: Page title (document title or og:title).
          type:
            - string
            - "null"
        url:
          description: The URL that was requested (echoed from the input).
          type: string
      required:
        - url
        - final_url
        - title
        - description
        - text
        - format
        - lang
        - published_at
        - status_code
        - content_type
      type: object
    WebPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - properties:
            data:
              $ref: '#/components/schemas/WebPage'
          type: object
      description: Success envelope whose data is a WebPage.
    WebResult:
      additionalProperties: false
      description: One web search result.
      properties:
        published_at:
          description: Publish date when the engine reports one, RFC 3339 UTC.
          format: date-time
          type:
            - string
            - "null"
        site:
          description: Hostname of the result without a leading www.
          type:
            - string
            - "null"
        snippet:
          description: Text snippet / description.
          type:
            - string
            - "null"
        title:
          description: Result title.
          type: string
        url:
          description: Result URL.
          type: string
      required:
        - title
        - url
        - snippet
        - site
        - published_at
      type: object
    WebResultPage:
      additionalProperties: false
      description: One page of web search results.
      properties:
        items:
          items:
            $ref: '#/components/schemas/WebResult'
          type: array
        next_cursor:
          description: Opaque cursor for the next page; null when the provider does not page.
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    WebResultPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - properties:
            data:
              $ref: '#/components/schemas/WebResultPage'
          type: object
      description: Success envelope whose data is a WebResultPage.
