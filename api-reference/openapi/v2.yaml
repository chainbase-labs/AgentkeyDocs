  /v2/ops/web.answer:
    post:
      description: |-
        Searches the web for the question and returns an engine-written answer plus the source pages it was grounded in (title, url, passage). Not a result list — use web.search for that. include_domains / exclude_domains / time_range route to an engine that supports them.

        Fixed price: 1.1 credits per successful call, whichever provider serves it.
      operationId: web_answer
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                country:
                  description: ISO 3166-1 alpha-2 country code to bias the search, e.g. US, CN.
                  type: string
                exclude_domains:
                  description: Exclude sources from these domains (routes to an engine that supports it).
                  items:
                    type: string
                  type: array
                fields:
                  $ref: '#/components/schemas/FieldsProjection'
                include_domains:
                  description: Restrict sources to these domains (routes to an engine that supports it).
                  items:
                    type: string
                  type: array
                include_raw:
                  $ref: '#/components/schemas/IncludeRaw'
                lang:
                  description: BCP 47 language tag for the answer and the sources, e.g. en, zh-Hans.
                  type: string
                provider:
                  $ref: '#/components/schemas/ProviderShorthand'
                query:
                  description: The question, in natural language.
                  type: string
                routing:
                  $ref: '#/components/schemas/Routing'
                time_range:
                  default: all
                  description: Only ground the answer in pages published within this window.
                  enum:
                    - day
                    - week
                    - month
                    - year
                    - all
                  type: string
              required:
                - query
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerEnvelope'
          description: Success envelope
        "400":
          $ref: '#/components/responses/ValidationError'
        "402":
          $ref: '#/components/responses/InsufficientCredits'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimited'
        "502":
          $ref: '#/components/responses/UpstreamFailed'
        "504":
          $ref: '#/components/responses/Timeout'
      security:
        - ApiKeyAuth: []
      summary: Answer a question from live web search results, with the sources the answer was grounded in.
      tags:
        - web
      x-action: answer
      x-price-credits: 1.1
      x-pricing: fixed
      x-providers:
        - tavily
      x-since: "2026-10-13"
      x-stability: beta
  /v2/ops/web.scrape:
    post:
      description: |-
        Fetches a single URL through a scraping provider and returns the main content as markdown (default) or plain text, plus title, description, language, publish time and the target's HTTP status where the provider reports them. format=text routes to a provider that can deliver plain text.

        Fixed price: 0.2 credits per successful call, whichever provider serves it. When firecrawl serves the call the fixed price is the floor: the provider meters the actual cost (per page / per document) and credits_charged reports it; describe carries the provider's note.
      operationId: web_scrape
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                fields:
                  $ref: '#/components/schemas/FieldsProjection'
                format:
                  default: markdown
                  description: Format of the returned text. markdown keeps headings, lists and links; text is plain text.
                  enum:
                    - markdown
                    - text
                  type: string
                include_raw:
                  $ref: '#/components/schemas/IncludeRaw'
                provider:
                  $ref: '#/components/schemas/ProviderShorthand'
                routing:
                  $ref: '#/components/schemas/Routing'
                url:
                  description: Absolute http(s) URL to fetch.
                  type: string
              required:
                - url
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebPageEnvelope'
          description: Success envelope
        "400":
          $ref: '#/components/responses/ValidationError'
        "402":
          $ref: '#/components/responses/InsufficientCredits'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimited'
        "502":
          $ref: '#/components/responses/UpstreamFailed'
        "504":
          $ref: '#/components/responses/Timeout'
      security:
        - ApiKeyAuth: []
      summary: Fetch one web page and return its readable text (markdown or plain text) with title and basic metadata.
      tags:
        - web
      x-action: scrape
      x-price-credits: 0.2
      x-pricing: fixed_floor_metered
      x-providers:
        - firecrawl
        - jina
        - tavily
        - brightdata
        - surf
      x-since: "2026-10-13"
      x-stability: beta
  /v2/ops/web.search:
    post:
      description: |-
        Keyword search over the web (type=web) or news (type=news). Results are normalized to WebResult; the server picks the engine and fails over. include_domains / exclude_domains route to an engine that supports them.

        Fixed price: 0.2 credits per successful call, whichever provider serves it.
      operationId: web_search
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                country:
                  description: ISO 3166-1 alpha-2 country code to bias results, e.g. US, CN.
                  type: string
                cursor:
                  description: Opaque pagination cursor from the previous response's next_cursor. Send the same query parameters with it.
                  type: string
                exclude_domains:
                  description: Exclude results from these domains (routes to an engine that supports it).
                  items:
                    type: string
                  type: array
                fields:
                  $ref: '#/components/schemas/FieldsProjection'
                include_domains:
                  description: Restrict results to these domains (routes to an engine that supports it).
                  items:
                    type: string
                  type: array
                include_raw:
                  $ref: '#/components/schemas/IncludeRaw'
                lang:
                  description: BCP 47 language tag for the results language, e.g. en, zh-Hans.
                  type: string
                limit:
                  default: 10
                  description: Maximum number of results to return.
                  maximum: 20
                  minimum: 1
                  type: integer
                provider:
                  $ref: '#/components/schemas/ProviderShorthand'
                query:
                  description: Search query.
                  type: string
                routing:
                  $ref: '#/components/schemas/Routing'
                time_range:
                  default: all
                  description: Only results published within this window.
                  enum:
                    - day
                    - week
                    - month
                    - year
                    - all
                  type: string
                type:
                  default: web
                  description: Result type. images and videos are planned as non-breaking additions.
                  enum:
                    - web
                    - news
                  type: string
              required:
                - query
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebResultPageEnvelope'
          description: Success envelope
        "400":
          $ref: '#/components/responses/ValidationError'
        "402":
          $ref: '#/components/responses/InsufficientCredits'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/RateLimited'
        "502":
          $ref: '#/components/responses/UpstreamFailed'
        "504":
          $ref: '#/components/responses/Timeout'
      security:
        - ApiKeyAuth: []
      summary: Web or news search across several engines. Returns a normalized result page.
      tags:
        - web
      x-action: search
      x-price-credits: 0.2
      x-pricing: fixed
      x-providers:
        - serper
        - brave
        - tavily
      x-since: "2026-10-12"
      x-stability: beta
  /v2/ops/{op}:
    get:
      description: Input/output schemas, bindings with list prices and live health, unsupported fields and examples. No authentication required.
      operationId: describeOp
      parameters:
        - in: path
          name: op
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodDescription'
          description: Method description
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unknown method
      summary: Describe a scenario method
      tags:
        - catalog
components:
  responses:
    InsufficientCredits:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Insufficient credits
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Not found (method, or upstream object)
    RateLimited:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Rate limited upstream
    Timeout:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Timed out
    UpstreamFailed:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: All providers failed
    ValidationError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Validation error (unknown field, bad cursor, bad routing)
  schemas:
    Answer:
      additionalProperties: false
      description: A natural-language answer to a question, grounded in web sources.
      properties:
        answer:
          description: The answer text as plain text / light markdown. Inline citation markers, when the engine emits them, are kept as-is.
          type: string
        sources:
          description: Web sources the answer was grounded in, best first. null when the engine does not expose its sources.
          items:
            properties:
              snippet:
                description: The passage of the source the engine used, when exposed.
                type:
                  - string
                  - "null"
              title:
                description: Source page title.
                type:
                  - string
                  - "null"
              url:
                description: Source URL.
                type: string
            required:
              - title
              - url
              - snippet
            type: object
          type:
            - array
            - "null"
      required:
        - answer
        - sources
      type: object
    AnswerEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - properties:
            data:
              $ref: '#/components/schemas/Answer'
          type: object
      description: Success envelope whose data is a Answer.
    Attempt:
      description: One upstream try. Present on success and failure so a failover is never invisible.
      properties:
        error_type:
          description: validation | not_found | rate_limit | timeout | upstream_unauthorized | upstream_unavailable | provider_error
          type: string
        provider:
          description: Provider slug.
          type: string
        refunded:
          description: true when the reservation for this attempt was refunded.
          type: boolean
        status:
          description: HTTP status AgentKey mapped this attempt to (200 on success).
          type: integer
        took_ms:
          type: integer
        tool:
          description: Registry tool name (Provider/operation) that was called.
          type: string
        upstream_status:
          description: The provider's real HTTP status; absent when nothing was received.
          type: integer
      required:
        - provider
        - tool
        - status
        - took_ms
      type: object
