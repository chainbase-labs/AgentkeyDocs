                description: Segment end, milliseconds.
                type:
                  - integer
                  - "null"
              start_ms:
                description: Segment start, milliseconds.
                type:
                  - integer
                  - "null"
              text:
                description: Segment text.
                type: string
            required:
              - start_ms
              - end_ms
              - text
            type: object
          type:
            - array
            - "null"
        text:
          description: Full transcript text.
          type: string
      required:
        - post_id
        - language
        - text
        - segments
        - platform
      type: object
    TranscriptEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - properties:
            data:
              $ref: '#/components/schemas/Transcript'
          type: object
      description: Success envelope whose data is a Transcript.
    TravelLocation:
      additionalProperties: false
      description: A destination or airport the travel provider knows, with the id its search endpoints take (decision 2026-10-13
      properties:
        code:
          description: IATA code for airports and cities when reported.
          type:
            - string
            - "null"
        country:
          description: Country name or code.
          type:
            - string
            - "null"
        id:
          description: Provider id to pass on — a Booking destination id for hotels, an airport / city id such as JFK.AIRPORT for flights.
          type: string
        kind:
          description: Which search the id is for (echoes the request).
          enum:
            - hotel
            - flight
          type: string
        lat:
          description: Latitude.
          type:
            - number
            - "null"
        lon:
          description: Longitude.
          type:
            - number
            - "null"
        name:
          description: Display name.
          type: string
        region:
          description: Region / state when reported.
          type:
            - string
            - "null"
        type:
          description: Place kind as the provider reports it (city, airport, region, district, landmark, hotel).
          type:
            - string
            - "null"
      required:
        - id
        - name
        - type
        - country
        - region
        - lat
        - lon
        - code
        - kind
      type: object
    TravelLocationPage:
      additionalProperties: false
      description: One page of destinations.
      properties:
        items:
          items:
            $ref: '#/components/schemas/TravelLocation'
          type: array
        next_cursor:
          description: Always null — lookups return one list.
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    TravelLocationPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - properties:
            data:
              $ref: '#/components/schemas/TravelLocationPage'
          type: object
      description: Success envelope whose data is a TravelLocationPage.
    User:
      additionalProperties: false
